<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- TODO 1: 브라우저 탭에 보일 제목 -->
  <title>정문기입 과제 아카이브 페이지</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="page">

  <main class="mac-window">

    <!-- 맥 스타일 창 상단 -->
    <header class="window-header">
      <div class="window-controls" aria-label="창 장식">
        <span class="window-dot red"></span>
        <span class="window-dot yellow"></span>
        <span class="window-dot green"></span>
      </div>

      <span class="window-title">DAHUI'S ARCHIVE</span>
      <span class="header-icon">✳</span>
    </header>

    <!-- 페이지 소개 -->
    <section class="hero">
      <p class="eyebrow">2026-2 SEMESTER</p>

      <!-- TODO 2: 이름 -->
      <h1 class="page-title">백다희의 과제 아카이브</h1>

      <!-- TODO 3: 한 줄 소개 -->
      <p class="page-description">
        26-2 정보문화기술입문 p5.js 과제 모음
      </p>
    </section>

    <!-- 과제 목록 -->
    <section class="projects">
      <div class="section-heading">
        <div>
          <p class="section-kicker">PROJECT LIBRARY</p>
          <h2>My Projects</h2>
      </div>

      <ul class="assignment-list">

        <!-- TODO 4: 과제 1 제목 -->
        <li class="assignment-card">
          <a href="assignment1/" class="assignment-link">
            <span class="project-number">01</span>

            <span class="project-info">
              <span class="project-name">Assignment 1: Photo</span>
            </span>

            <span class="status completed">
              <span class="status-dot"></span>
              COMPLETED
            </span>

            <span class="card-arrow">↗</span>
          </a>
        </li>

        <!-- TODO 5: 과제 2 제목 -->
        <li class="assignment-card">
          <a href="assignment2/" class="assignment-link">
            <span class="project-number">02</span>

            <span class="project-info">
              <span class="project-name">Assignment 2: Random</span>
            </span>

            <span class="status completed">
              <span class="status-dot"></span>
              COMPLETED
            </span>

            <span class="card-arrow">↗</span>
          </a>
        </li>

        <!-- TODO 6: 과제 3 제목 -->
        <li class="assignment-card">
          <a href="assignment3/" class="assignment-link">
            <span class="project-number">03</span>

            <span class="project-info">
              <span class="project-name">Assignment 3: Button</span>
            </span>

            <span class="status completed">
              <span class="status-dot"></span>
              COMPLETED
            </span>

            <span class="card-arrow">↗</span>
          </a>
        </li>

      </ul>
    </section>

    <!-- 하단 문구 -->
    <footer class="window-footer">
      <p class="coming-soon">TO BE CONTINUED<span>...</span></p>
    </footer>

  </main>

</body>
</html>
